<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本17天旅遊行程</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1410;--paper:#faf7f2;--cream:#f0ebe0;
  --accent:#c0392b;--gold:#c9a84c;--muted:#8a7e72;
  --soft:#e8e0d0;--green:#3d7a5c;--blue:#2c5f8a;--metro:#e65c00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--cream);font-family:'Noto Sans TC',sans-serif;color:var(--ink);min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:72px;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23c9a84c' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.panel{display:none}.panel.active{display:block}

/* Header */
.app-header{background:var(–ink);color:var(–paper);padding:18px 18px 0;position:sticky;top:0;z-index:100;}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.trip-title{font-family:‘Playfair Display’,serif;font-size:22px;letter-spacing:1px;color:var(–gold);}
.trip-subtitle{font-size:10px;color:var(–muted);margin-top:2px;letter-spacing:2px;text-transform:uppercase;}
.header-badge{background:var(–accent);color:white;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:700;}

/* Bottom Tab */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(–ink);display:flex;border-top:1px solid rgba(255,255,255,0.08);z-index:100;}
.tab-btn{flex:1;background:none;border:none;color:var(–muted);font-family:‘Noto Sans TC’,sans-serif;font-size:11px;padding:10px 4px 10px;cursor:pointer;position:relative;transition:color .2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab-btn .ti{font-size:18px;}
.tab-btn.active{color:var(–gold);}
.tab-btn.active::after{content:’’;position:absolute;top:0;left:25%;right:25%;height:2px;background:var(–gold);border-radius:0 0 2px 2px;}

/* Day chips */
.day-selector-wrap{padding:12px 16px 0;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.day-selector-wrap::-webkit-scrollbar{display:none;}
.region-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(–muted);margin-bottom:6px;display:block;}
.day-chips{display:inline-flex;gap:6px;padding-bottom:10px;}
.day-chip{display:inline-flex;flex-direction:column;align-items:center;background:white;border:1.5px solid var(–soft);border-radius:12px;padding:5px 9px;cursor:pointer;transition:all .18s;min-width:48px;}
.day-chip.active{background:var(–ink);border-color:var(–ink);color:white;}
.day-chip.active .chip-num{color:var(–gold);}
.day-chip.has-content{border-color:var(–gold);}
.chip-label{font-size:8px;color:var(–muted);letter-spacing:1px;}
.day-chip.active .chip-label{color:rgba(255,255,255,.5);}
.chip-num{font-size:14px;font-weight:700;}
.chip-dot{width:4px;height:4px;border-radius:50%;background:var(–gold);margin-top:2px;}
.day-chip.active .chip-dot{background:var(–accent);}

/* Day header */
.day-content{padding:14px 14px 20px;}
.day-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(–soft);}
.day-number{font-family:‘DM Mono’,monospace;font-size:10px;color:var(–accent);letter-spacing:2px;text-transform:uppercase;}
.day-main-title{font-size:17px;font-weight:700;margin-top:2px;line-height:1.3;}
.day-date{font-size:11px;color:var(–muted);margin-top:2px;}
.total-label{font-size:9px;color:var(–muted);letter-spacing:1px;text-align:right;}
.total-amount{font-family:‘DM Mono’,monospace;font-size:15px;font-weight:500;color:var(–green);}

/* Timeline */
.itinerary-list{display:flex;flex-direction:column;}
.item-row{display:flex;align-items:stretch;}
.time-col{width:50px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:12px;}
.time-bubble{font-family:‘DM Mono’,monospace;font-size:11px;font-weight:500;color:var(–blue);background:rgba(44,95,138,.10);border-radius:8px;padding:3px 4px;text-align:center;line-height:1.2;white-space:nowrap;min-width:42px;}
.time-bubble.metro-time{color:var(–metro);background:rgba(230,92,0,.10);}
.time-line{flex:1;width:2px;background:var(–soft);margin:4px 0;border-radius:1px;}
.item-body-col{flex:1;padding:10px 0 10px 6px;}

/* Item card */
.item-card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(26,20,16,.06);border:1px solid rgba(201,168,76,.15);margin-bottom:10px;transition:border-color .15s;}
.item-card.edit-mode{border-color:var(–gold);box-shadow:0 0 0 2px rgba(201,168,76,.2);}
.item-card-inner{padding:11px 12px;}
.item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.item-tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;letter-spacing:.3px;}
.tag-transport{background:#e8f0f8;color:var(–blue);}
.tag-food{background:#fef3e0;color:#c17d00;}
.tag-sight{background:#e8f5ee;color:var(–green);}
.tag-stay{background:#f5e8f5;color:#7b3fa0;}
.tag-shop{background:#fde8e8;color:var(–accent);}
.tag-festival{background:#fff3e0;color:#e65c00;}
.item-cost{font-family:‘DM Mono’,monospace;font-size:12px;color:var(–green);font-weight:500;}
.item-name-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.item-name{font-size:14px;font-weight:600;}
.map-icon-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:0 1px;line-height:1;flex-shrink:0;opacity:.6;transition:opacity .15s;}
.map-icon-btn:hover{opacity:1;}
.item-note{font-size:11px;color:var(–muted);margin-top:4px;line-height:1.5;}
.sub-notes{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.sub-note{font-size:11px;color:var(–ink);background:var(–cream);border-radius:6px;padding:3px 8px;display:flex;align-items:flex-start;gap:5px;}
.sub-note-bullet{color:var(–gold);font-size:8px;margin-top:3px;flex-shrink:0;}
.edit-overlay-btns{display:none;gap:6px;padding:0 10px 9px;}
.item-card.edit-mode .edit-overlay-btns{display:flex;}
.card-edit-btn{flex:1;background:var(–cream);border:none;border-radius:8px;padding:6px;font-size:11px;cursor:pointer;color:var(–ink);font-family:‘Noto Sans TC’,sans-serif;}
.card-del-btn{background:none;border:1px solid #f0d0d0;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;color:var(–accent);}

/* Metro card */
.metro-card{background:linear-gradient(135deg,#1a1410 0%,#2c1a0e 100%);border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 10px rgba(26,20,16,.12);}
.metro-card.edit-mode{box-shadow:0 0 0 2px rgba(201,168,76,.4);}
.metro-header{padding:9px 12px 7px;display:flex;align-items:center;gap:7px;border-bottom:1px solid rgba(255,255,255,.08);}
.metro-icon{font-size:16px;}
.metro-title-text{font-size:13px;font-weight:600;color:white;}
.metro-fare-total{font-family:‘DM Mono’,monospace;font-size:11px;color:var(–gold);margin-left:auto;}
.metro-lines{padding:7px 12px 9px;display:flex;flex-direction:column;gap:5px;}
.metro-line-item{display:flex;align-items:center;gap:6px;}
.metro-line-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;font-family:‘DM Mono’,monospace;white-space:nowrap;flex-shrink:0;}
.metro-line-desc{font-size:11px;color:rgba(255,255,255,.65);}
.metro-fare{font-family:‘DM Mono’,monospace;font-size:11px;color:var(–gold);margin-left:auto;flex-shrink:0;}
.metro-note-text{font-size:10px;color:rgba(255,255,255,.4);padding:0 12px 7px;}
.metro-edit-btns{display:none;gap:6px;padding:0 12px 9px;}
.metro-card.edit-mode .metro-edit-btns{display:flex;}
.overlay-edit-btn{flex:1;background:rgba(255,255,255,.08);border:none;border-radius:8px;padding:6px;font-size:11px;cursor:pointer;color:rgba(255,255,255,.8);font-family:‘Noto Sans TC’,sans-serif;}
.overlay-edit-btn.danger{color:#e57373;background:rgba(229,115,115,.12);}

/* Add btns */
.add-item-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:none;border:1.5px dashed var(–soft);border-radius:12px;padding:12px;color:var(–muted);font-size:13px;cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;transition:all .15s;margin-top:4px;}
.add-item-btn:hover{border-color:var(–gold);color:var(–gold);}
.add-metro-item-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:none;border:1.5px dashed rgba(230,92,0,.25);border-radius:12px;padding:12px;color:var(–metro);font-size:13px;cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;transition:all .15s;margin-top:6px;}
.add-metro-item-btn:hover{border-color:var(–metro);}
.empty-state{text-align:center;padding:36px 20px;color:var(–muted);}
.empty-state .ei{font-size:34px;margin-bottom:10px;}
.empty-state p{font-size:13px;}

/* FAB */
.fab-group{position:fixed;bottom:82px;right:18px;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;z-index:200;}
.fab{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .15s;font-size:20px;}
.fab:active{transform:scale(.92);}
.fab-add{background:var(–accent);color:white;}
.fab-edit{background:var(–ink);color:var(–gold);font-size:17px;}
.fab-edit.active{background:var(–gold);color:var(–ink);}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(26,20,16,.55);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:white;border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;position:relative;}
.modal-handle{width:36px;height:4px;background:var(–soft);border-radius:2px;margin:14px auto 0;}
.modal-inner{padding:14px 18px 36px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.modal-close{position:absolute;top:14px;right:16px;background:var(–cream);border:none;width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;color:var(–muted);}
.map-frame{width:100%;height:300px;border-radius:12px;border:none;margin-top:6px;display:block;background:var(–cream);}

/* Forms */
.edit-form{display:flex;flex-direction:column;gap:11px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-label{font-size:10px;color:var(–muted);letter-spacing:1.5px;text-transform:uppercase;}
.form-input,.form-textarea{background:var(–cream);border:1.5px solid var(–soft);border-radius:10px;padding:9px 11px;font-size:14px;font-family:‘Noto Sans TC’,sans-serif;color:var(–ink);width:100%;outline:none;transition:border-color .15s;}
.form-input:focus,.form-textarea:focus{border-color:var(–gold);}
.form-textarea{resize:vertical;min-height:60px;}
.form-row{display:flex;gap:9px;}
.form-row .form-group{flex:1;}
.save-btn{background:var(–ink);color:var(–gold);border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;}
.delete-btn{background:none;color:var(–accent);border:1.5px solid var(–accent);border-radius:12px;padding:11px;font-size:13px;cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;}
.tag-select{display:flex;flex-wrap:wrap;gap:5px;}
.tag-opt{padding:4px 11px;border-radius:20px;border:1.5px solid var(–soft);font-size:12px;cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;background:white;transition:all .15s;}
.tag-opt.selected{background:var(–ink);color:white;border-color:var(–ink);}

/* Sub-notes editor */
.sub-notes-editor{display:flex;flex-direction:column;gap:5px;}
.sub-note-input-row{display:flex;gap:5px;align-items:center;}
.sub-note-input-row .form-input{flex:1;}
.remove-subnote{background:none;border:1px solid var(–soft);border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer;color:var(–muted);flex-shrink:0;}
.add-subnote-btn{background:none;border:1.5px dashed var(–soft);border-radius:8px;padding:7px;font-size:12px;color:var(–muted);cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;width:100%;}

/* Metro line form */
.metro-lines-editor{display:flex;flex-direction:column;gap:8px;}
.metro-line-row{background:var(–cream);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:5px;}
.metro-line-row-top{display:flex;gap:5px;}
.remove-metro-line{background:none;border:1px solid var(–soft);border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer;color:var(–accent);flex-shrink:0;}
.add-metro-line-btn{background:none;border:1.5px dashed var(–soft);border-radius:8px;padding:8px;font-size:12px;color:var(–muted);cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;width:100%;}
.color-presets{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;}
.color-preset{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2.5px solid transparent;transition:border-color .12s;}
.color-preset.selected{border-color:var(–ink);}

/* Overview */
.overview-panel{padding:14px 14px 20px;}
.overview-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.stat-card{background:white;border-radius:13px;padding:12px;box-shadow:0 2px 8px rgba(26,20,16,.06);}
.stat-label{font-size:9px;color:var(–muted);letter-spacing:1.5px;text-transform:uppercase;}
.stat-value{font-size:21px;font-weight:700;margin-top:3px;font-family:‘DM Mono’,monospace;}
.stat-sub{font-size:10px;color:var(–muted);margin-top:2px;}
.section-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(–muted);margin-bottom:9px;}
.region-cards{display:flex;flex-direction:column;gap:8px;}
.region-card{background:white;border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(26,20,16,.05);border-left:4px solid var(–gold);}
.region-name{font-size:14px;font-weight:600;}
.region-days{font-size:11px;color:var(–muted);margin-top:2px;}
.region-tag{font-size:11px;color:var(–muted);}

/* QR Panel */
.qr-panel{padding:14px 14px 20px;}
.qr-grid{display:flex;flex-direction:column;gap:9px;margin-bottom:11px;}
.qr-card{background:white;border-radius:13px;padding:11px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 2px 10px rgba(26,20,16,.06);}
.qr-placeholder{width:76px;height:76px;background:var(–cream);border-radius:9px;border:2px dashed var(–soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;cursor:pointer;overflow:hidden;position:relative;}
.qr-placeholder input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.qr-placeholder img{width:100%;height:100%;object-fit:cover;border-radius:7px;}
.qr-info{flex:1;}
.qr-name{font-size:14px;font-weight:600;}
.qr-desc{font-size:11px;color:var(–muted);margin-top:3px;line-height:1.5;}
.qr-date{font-size:10px;color:var(–blue);margin-top:4px;font-family:‘DM Mono’,monospace;}
.qr-action-btns{display:flex;gap:5px;margin-top:7px;}
.qr-edit-btn{background:var(–cream);border:none;border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;color:var(–ink);font-family:‘Noto Sans TC’,sans-serif;}
.qr-del-btn{background:none;border:1px solid #f0d0d0;border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;color:var(–accent);font-family:‘Noto Sans TC’,sans-serif;}
.add-qr-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:none;border:1.5px dashed var(–soft);border-radius:12px;padding:13px;color:var(–muted);font-size:13px;cursor:pointer;font-family:‘Noto Sans TC’,sans-serif;transition:all .15s;}
.add-qr-btn:hover{border-color:var(–gold);color:var(–gold);}
</style>

</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div>
      <div class="trip-title">🇯🇵 日本之旅</div>
      <div class="trip-subtitle">2025 · 17 DAYS</div>
    </div>
    <div class="header-badge">5/12 → 5/28</div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('itinerary')" id="tab-itinerary"><span class="ti">📅</span>行程</button>
  <button class="tab-btn" onclick="switchTab('overview')" id="tab-overview"><span class="ti">📊</span>總覽</button>
  <button class="tab-btn" onclick="switchTab('qr')" id="tab-qr"><span class="ti">🎫</span>票券</button>
</div>

<!-- ITINERARY -->

<div id="panel-itinerary" class="panel active">
  <div class="day-selector-wrap">
    <span class="region-label">選擇日期</span>
    <div class="day-chips" id="dayChips"></div>
  </div>
  <div class="day-content" id="dayContent"></div>
</div>

<!-- OVERVIEW -->

<div id="panel-overview" class="panel">
  <div class="overview-panel">
    <div class="overview-stats">
      <div class="stat-card"><div class="stat-label">總天數</div><div class="stat-value" style="color:var(--blue)">17</div><div class="stat-sub">5/12 – 5/28</div></div>
      <div class="stat-card"><div class="stat-label">預計花費</div><div class="stat-value" style="color:var(--green)" id="totalBudget">¥0</div><div class="stat-sub">所有行程加總</div></div>
      <div class="stat-card"><div class="stat-label">景點數</div><div class="stat-value" style="color:var(--accent)" id="totalSpots">0</div><div class="stat-sub">已規劃</div></div>
      <div class="stat-card"><div class="stat-label">住宿城市</div><div class="stat-value" style="color:var(--gold)">4</div><div class="stat-sub">東京/金澤/京都/大阪</div></div>
    </div>
    <div class="section-label">地區行程</div>
    <div class="region-cards">
      <div class="region-card" style="border-color:#e74c3c"><div><div class="region-name">🗼 東京</div><div class="region-days">第1–5天 · 5/12–5/16</div></div><div class="region-tag">東京都</div></div>
      <div class="region-card" style="border-color:#3498db"><div><div class="region-name">🏔️ 金澤</div><div class="region-days">第6–8天 · 5/17–5/19</div></div><div class="region-tag">石川縣</div></div>
      <div class="region-card" style="border-color:#9b59b6"><div><div class="region-name">⛩️ 京都</div><div class="region-days">第9–15天 · 5/20–5/26</div></div><div class="region-tag">京都府</div></div>
      <div class="region-card" style="border-color:#f39c12"><div><div class="region-name">🦀 大阪</div><div class="region-days">第16–17天 · 5/26–5/28</div></div><div class="region-tag">大阪府</div></div>
    </div>
  </div>
</div>

<!-- QR -->

<div id="panel-qr" class="panel">
  <div class="qr-panel">
    <div class="section-label">票券 &amp; 折價券</div>
    <div class="qr-grid" id="qrGrid"></div>
    <button class="add-qr-btn" onclick="openAddQR()">＋ 新增票券 / 折價券</button>
  </div>
</div>

<!-- FABs -->

<div class="fab-group" id="fabGroup">
  <button class="fab fab-add" onclick="openAddItem()" title="新增行程">＋</button>
  <button class="fab fab-edit" id="fabEdit" onclick="toggleEditMode()" title="編輯模式">✏️</button>
</div>

<!-- Map Modal -->

<div class="modal-overlay" id="mapModal" onclick="overlayClose(event,'mapModal',closeMap)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-inner">
      <button class="modal-close" onclick="closeMap()">✕</button>
      <div class="modal-title" id="mapTitle">地圖</div>
      <iframe id="mapFrame" class="map-frame" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" src="about:blank"></iframe>
    </div>
  </div>
</div>

<!-- Edit Item Modal -->

<div class="modal-overlay" id="editModal" onclick="overlayClose(event,'editModal',closeEdit)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>

// ── Chips ──
function renderDayChips(){
  const wrap=document.getElementById('dayChips');
  wrap.innerHTML='';
  for(let i=1;i<=17;i++){
    const d=data.days[i];
    const has=d&&((d.items&&d.items.length>0)||(d.transit&&d.transit.length>0));
    const ch=document.createElement('div');
    ch.className=`day-chip${i===currentDay?' active':''}${has?' has-content':''}`;
    ch.innerHTML=`<span class="chip-label">DAY</span><span class="chip-num">${i}</span>${has?'<div class="chip-dot"></div>':''}`;
    ch.onclick=()=>selectDay(i);
    wrap.appendChild(ch);
  }
}
function selectDay(n){
  currentDay=n; renderDayChips(); renderDayContent();
  setTimeout(()=>{const c=document.querySelectorAll('.day-chip');if(c[n-1])c[n-1].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},50);
}

// ── Day Content ──
function renderDayContent(){
  const wrap=document.getElementById('dayContent');
  const day=data.days[currentDay];
  const dateDay=11+currentDay;
  let totalCost=0;
  if(day){
    (day.items||[]).forEach(it=>totalCost+=(it.cost||0));
    (day.transit||[]).forEach(tr=>(tr.lines||[]).forEach(l=>totalCost+=(parseInt(l.fare)||0)));
  }
  wrap.innerHTML=`
    <div class="day-header">
      <div>
        <div class="day-number">DAY ${currentDay}</div>
        <div class="day-main-title">${day?day.title:'待規劃'}</div>
        <div class="day-date">2025年5月${dateDay}日${day&&day.subtitle?' · '+day.subtitle:''}</div>
      </div>
      <div>
        <div class="total-label">預算合計</div>
        <div class="total-amount">¥${totalCost.toLocaleString()}</div>
      </div>
    </div>
    <div class="itinerary-list">${buildAllItems(day)}</div>
    <button class="add-item-btn" onclick="openAddItem()">＋ 新增行程項目</button>
    <button class="add-metro-item-btn" onclick="openAddMetro()">🚇 新增交通路線</button>`;
}

function buildAllItems(day){
  if(!day) return `<div class="empty-state"><div class="ei">✏️</div><p>這天還沒有行程<br>點底部＋新增！</p></div>`;
  const all=[];
  (day.transit||[]).forEach(t=>all.push({type:'metro',data:t,sortTime:t.time||'00:00'}));
  (day.items||[]).forEach(it=>all.push({type:'item',data:it,sortTime:it.time||'00:00'}));
  all.sort((a,b)=>a.sortTime.localeCompare(b.sortTime));
  if(!all.length) return `<div class="empty-state"><div class="ei">✏️</div><p>這天還沒有行程<br>點底部＋新增！</p></div>`;
  return all.map((e,i)=>e.type==='metro'?renderMetroCard(e.data,i===all.length-1):renderItemCard(e.data,i===all.length-1)).join('');
}

function renderItemCard(item,isLast){
  const sn=(item.subnotes||[]).length>0
    ?`<div class="sub-notes">${item.subnotes.map(s=>`<div class="sub-note"><span class="sub-note-bullet">◆</span>${s}</div>`).join('')}</div>`:'';
  const mapBtn=item.location
    ?`<button class="map-icon-btn" onclick="openMap('${esc(item.location)}','${esc(item.name)}')" title="查看地圖">📍</button>`:'';
  const editBtns=editMode?`<div class="edit-overlay-btns"><button class="card-edit-btn" onclick="openEdit(${currentDay},${item.id})">✏️ 編輯</button><button class="card-del-btn" onclick="deleteItem(${currentDay},${item.id})">🗑</button></div>`:'';
  return `<div class="item-row">
    <div class="time-col">
      ${item.time?`<div class="time-bubble">${item.time}</div>`:'<div style="height:20px"></div>'}
      ${!isLast?'<div class="time-line"></div>':''}
    </div>
    <div class="item-body-col">
      <div class="item-card${editMode?' edit-mode':''}" id="item-${item.id}">
        <div class="item-card-inner">
          <div class="item-top">
            ${item.tag?`<span class="item-tag tag-${item.tag}">${TAG_NAMES[item.tag]||item.tag}</span>`:'<span></span>'}
            ${item.cost>0?`<span class="item-cost">¥${item.cost.toLocaleString()}</span>`:'<span></span>'}
          </div>
          <div class="item-name-row"><span class="item-name">${item.name}</span>${mapBtn}</div>
          ${item.note?`<div class="item-note">${item.note}</div>`:''}
          ${sn}
        </div>
        ${editBtns}
      </div>
    </div>
  </div>`;
}

function renderMetroCard(metro,isLast){
  const totalFare=(metro.lines||[]).reduce((s,l)=>s+(parseInt(l.fare)||0),0);
  const linesHtml=(metro.lines||[]).map(l=>`
    <div class="metro-line-item">
      <span class="metro-line-badge" style="background:${l.color||'#333'};color:white">${l.badge}</span>
      <span class="metro-line-desc">${l.desc||''}</span>
      ${parseInt(l.fare)>0?`<span class="metro-fare">¥${parseInt(l.fare).toLocaleString()}</span>`:''}
    </div>`).join('');
  const editBtns=editMode?`<div class="metro-edit-btns"><button class="overlay-edit-btn" onclick="openEditMetro(${currentDay},'${metro.id}')">✏️ 編輯</button><button class="overlay-edit-btn danger" onclick="deleteMetro(${currentDay},'${metro.id}')">🗑 刪除</button></div>`:'';
  return `<div class="item-row">
    <div class="time-col">
      ${metro.time?`<div class="time-bubble metro-time">${metro.time}</div>`:'<div style="height:20px"></div>'}
      ${!isLast?'<div class="time-line" style="background:rgba(230,92,0,.2)"></div>':''}
    </div>
    <div class="item-body-col">
      <div class="metro-card${editMode?' edit-mode':''}" id="metro-${metro.id}">
        <div class="metro-header">
          <span class="metro-icon">🚇</span>
          <span class="metro-title-text">${metro.title}</span>
          ${totalFare>0?`<span class="metro-fare-total">¥${totalFare.toLocaleString()}</span>`:''}
        </div>
        <div class="metro-lines">${linesHtml}</div>
        ${metro.note?`<div class="metro-note-text">${metro.note}</div>`:''}
        ${editBtns}
      </div>
    </div>
  </div>`;
}

function esc(s){return(s||'').replace(/'/g,"&#39;").replace(/"/g,'&quot;');}

// ── Edit Mode FAB ──
function toggleEditMode(){
  editMode=!editMode;
  const fab=document.getElementById('fabEdit');
  fab.classList.toggle('active',editMode);
  fab.textContent=editMode?'✅':'✏️';
  renderDayContent();
}

// ── Map ──
function openMap(loc,name){
  document.getElementById('mapTitle').textContent='📍 '+name;
  const q=encodeURIComponent(loc+' Japan');
  document.getElementById('mapFrame').src=`https://maps.google.com/maps?q=${q}&output=embed&hl=zh-TW&zoom=15`;
  document.getElementById('mapModal').classList.add('open');
}
function closeMap(){
  document.getElementById('mapModal').classList.remove('open');
  setTimeout(()=>document.getElementById('mapFrame').src='about:blank',400);
}

// ── Item Edit ──
function openEdit(dayNum,itemId){
  const item=data.days[dayNum].items.find(i=>i.id===itemId);
  if(!item)return;
  editingItemKey={dayNum,itemId};
  buildEditForm('編輯行程',item);
}
function openAddItem(){
  editingItemKey=null;
  buildEditForm('新增行程',{time:'',name:'',note:'',cost:0,tag:'sight',location:'',subnotes:[]});
}
function buildEditForm(title,item){
  document.getElementById('editTitle').textContent=title;
  const tags=['transport','food','sight','stay','shop','festival'];
  const tagNames={transport:'🚆 交通',food:'🍜 美食',sight:'🗼 景點',stay:'🏨 住宿',shop:'🛍 購物',festival:'🎉 祭典'};
  const sn=item.subnotes||[];
  document.getElementById('editForm').innerHTML=`
    <div class="form-row">
      <div class="form-group"><label class="form-label">時間</label><input class="form-input" id="ef-time" placeholder="10:00" value="${item.time||''}"></div>
      <div class="form-group"><label class="form-label">費用 (¥)</label><input class="form-input" id="ef-cost" type="number" placeholder="0" value="${item.cost||0}"></div>
    </div>
    <div class="form-group"><label class="form-label">名稱</label><input class="form-input" id="ef-name" placeholder="行程名稱" value="${item.name||''}"></div>

```

<div class="form-group"><label class="form-label">類型</label><div class="tag-select">${tags.map(t=>`<button type="button" class="tag-opt${item.tag===t?' selected':''}" data-tag="${t}" onclick="selTag(this)">${tagNames[t]}</button>`).join('')}</div></div>
<div class="form-group">
  <label class="form-label">小備注（口袋名單、注意事項）</label>
  <div class="sub-notes-editor" id="snEditor">${sn.map((s,i)=>`<div class="sub-note-input-row" id="snr-${i}"><input class="form-input" value="${s.replace(/"/g,'&quot;')}"><button type="button" class="remove-subnote" onclick="rmSN(${i})">✕</button></div>`).join('')}</div>
  <button type="button" class="add-subnote-btn" onclick="addSN()">＋ 新增小備注</button>
</div>
<button class="save-btn" onclick="saveItem()">💾 儲存</button>
${editingItemKey?`<button class="delete-btn" onclick="delCurrentItem()">🗑 刪除此項目</button>`:''}`;

document.getElementById(‘editModal’).classList.add(‘open’);
}
function addSN(){
const ed=document.getElementById(‘snEditor’);
const i=ed.querySelectorAll(’.sub-note-input-row’).length;
ed.insertAdjacentHTML(‘beforeend’,`<div class="sub-note-input-row" id="snr-${i}"><input class="form-input" placeholder="備注內容"><button type="button" class="remove-subnote" onclick="rmSN(${i})">✕</button></div>`);
}
function rmSN(i){const r=document.getElementById(`snr-${i}`);if(r)r.remove();}
function selTag(btn){document.querySelectorAll(’.tag-opt’).forEach(b=>b.classList.remove(‘selected’));btn.classList.add(‘selected’);}
function saveItem(){
const time=document.getElementById(‘ef-time’).value.trim();
const name=document.getElementById(‘ef-name’).value.trim();
const note=document.getElementById(‘ef-note’).value.trim();
const cost=parseInt(document.getElementById(‘ef-cost’).value)||0;
const location=document.getElementById(‘ef-location’).value.trim();
const tagEl=document.querySelector(’.tag-opt.selected’);
const tag=tagEl?tagEl.dataset.tag:‘sight’;
if(!name){alert(‘請輸入行程名稱’);return;}
const subnotes=Array.from(document.querySelectorAll(’#snEditor input’)).map(i=>i.value.trim()).filter(Boolean);
if(editingItemKey){
const{dayNum,itemId}=editingItemKey;
Object.assign(data.days[dayNum].items.find(i=>i.id===itemId),{time,name,note,cost,location,tag,subnotes});
} else {
if(!data.days[currentDay].items) data.days[currentDay].items=[];
data.days[currentDay].items.push({id:Date.now(),time,name,note,cost,location,tag,subnotes});
}
closeEdit(); renderDayChips(); renderDayContent(); updateOverview();
}
function deleteItem(dayNum,itemId){
if(!confirm(‘確定要刪除？’))return;
data.days[dayNum].items=data.days[dayNum].items.filter(i=>i.id!==itemId);
renderDayChips(); renderDayContent(); updateOverview();
}
function delCurrentItem(){
if(!editingItemKey||!confirm(‘確定刪除？’))return;
const{dayNum,itemId}=editingItemKey;
data.days[dayNum].items=data.days[dayNum].items.filter(i=>i.id!==itemId);
closeEdit(); renderDayChips(); renderDayContent(); updateOverview();
}
function closeEdit(){document.getElementById(‘editModal’).classList.remove(‘open’);editingItemKey=null;}

// ── Metro Edit ──
function openAddMetro(){editingMetroKey=null;buildMetroForm(‘新增交通路線’,{title:’’,time:’’,note:’’,lines:[{badge:’’,color:’#e74c3c’,desc:’’,fare:’’}]});}
function openEditMetro(dayNum,metroId){
const m=data.days[dayNum].transit.find(t=>t.id===metroId);
if(!m)return;
editingMetroKey={dayNum,metroId};
buildMetroForm(‘編輯交通路線’,m);
}
function buildMetroForm(title,metro){
document.getElementById(‘metroTitle’).textContent=title;
const linesHtml=(metro.lines||[{badge:’’,color:’#e74c3c’,desc:’’,fare:’’}]).map((l,i)=>metroLineHTML(l,i)).join(’’);
document.getElementById(‘metroForm’).innerHTML=` <div class="form-row"> <div class="form-group" style="flex:2"><label class="form-label">路線標題</label><input class="form-input" id="mf-title" placeholder="例：南千住 → 上野" value="${metro.title||''}"></div> <div class="form-group"><label class="form-label">時間</label><input class="form-input" id="mf-time" placeholder="09:00" value="${metro.time||''}"></div> </div> <div class="form-group"><label class="form-label">備注</label><input class="form-input" id="mf-note" placeholder="乘車備注" value="${metro.note||''}"></div> <div class="form-group"> <label class="form-label">路線明細（可新增換乘）</label> <div class="metro-lines-editor" id="mlEditor">${linesHtml}</div> <button type="button" class="add-metro-line-btn" onclick="addMetroLine()">＋ 新增換乘路線</button> </div> <button class="save-btn" onclick="saveMetro()">💾 儲存</button> ${editingMetroKey?`<button class="delete-btn" onclick="delCurrentMetro()">🗑 刪除此路線</button>`:''}`;
document.getElementById(‘metroModal’).classList.add(‘open’);
}
function metroLineHTML(l,i){
const pres=METRO_COLORS.map((c,ci)=>`<div class="color-preset${l.color===c?' selected':''}" style="background:${c}" data-color="${c}" onclick="selMetroColor(${i},this)"></div>`).join(’’);
return `<div class="metro-line-row" id="mlr-${i}">
<div class="metro-line-row-top">
<input class="form-input" style="flex:1" id="mlb-${i}" placeholder="線名 e.g.日比谷線" value="${l.badge||''}">
<input class="form-input" style="width:65px" id="mlf-${i}" type="number" placeholder="¥" value="${l.fare||''}">
<button type="button" class="remove-metro-line" onclick="rmMetroLine(${i})">✕</button>
</div>
<input class="form-input" id="mld-${i}" placeholder="說明 e.g. 南千住→上野（5分）" value="${l.desc||''}">
<div class="color-presets" id="mlc-${i}">${pres}</div>

  </div>`;
}
function addMetroLine(){
  const ed=document.getElementById('mlEditor');
  const i=ed.querySelectorAll('.metro-line-row').length;
  ed.insertAdjacentHTML('beforeend',metroLineHTML({badge:'',color:METRO_COLORS[i%METRO_COLORS.length],desc:'',fare:''},i));
}
function rmMetroLine(i){const r=document.getElementById(`mlr-${i}`);if(r)r.remove();}
function selMetroColor(i,el){
  document.getElementById(`mlc-${i}`).querySelectorAll('.color-preset').forEach(p=>p.classList.remove('selected'));
  el.classList.add('selected');
}
function getMetroLines(){
  return Array.from(document.querySelectorAll('#mlEditor .metro-line-row')).map(row=>{
    const i=row.id.replace('mlr-','');
    const sc=row.querySelector('.color-preset.selected');
    return{badge:document.getElementById(`mlb-${i}`)?.value.trim()||'',desc:document.getElementById(`mld-${i}`)?.value.trim()||'',fare:document.getElementById(`mlf-${i}`)?.value||'',color:sc?sc.dataset.color:'#333'};
  }).filter(l=>l.badge);
}
function saveMetro(){
  const title=document.getElementById('mf-title').value.trim();
  const time=document.getElementById('mf-time').value.trim();
  const note=document.getElementById('mf-note').value.trim();
  const lines=getMetroLines();
  if(!title){alert('請輸入路線標題');return;}
  if(!data.days[currentDay].transit) data.days[currentDay].transit=[];
  if(editingMetroKey){
    const{dayNum,metroId}=editingMetroKey;
    Object.assign(data.days[dayNum].transit.find(t=>t.id===metroId),{title,time,note,lines});
  } else {
    data.days[currentDay].transit.push({id:'t'+Date.now(),title,time,note,lines});
  }
  closeMetro(); renderDayChips(); renderDayContent(); updateOverview();
}
function deleteMetro(dayNum,metroId){
  if(!confirm('確定刪除？'))return;
  data.days[dayNum].transit=data.days[dayNum].transit.filter(t=>t.id!==metroId);
  renderDayChips(); renderDayContent(); updateOverview();
}
function delCurrentMetro(){
  if(!editingMetroKey||!confirm('確定刪除？'))return;
  const{dayNum,metroId}=editingMetroKey;
  data.days[dayNum].transit=data.days[dayNum].transit.filter(t=>t.id!==metroId);
  closeMetro(); renderDayChips(); renderDayContent(); updateOverview();
}
function closeMetro(){document.getElementById('metroModal').classList.remove('open');editingMetroKey=null;}

// ── QR ──
function renderQR(){
document.getElementById(‘qrGrid’).innerHTML=qrItems.map(q=>` <div class="qr-card"> <div class="qr-placeholder" title="點擊上傳圖片"> ${q.img?`<img src="${q.img}" alt="QR">`:'🎫'} <input type="file" accept="image/*" onchange="uploadQR(${q.id},this)"> </div> <div class="qr-info"> <div class="qr-name">${q.name}</div> <div class="qr-desc">${q.desc}</div> <div class="qr-date">${q.date}</div> <div class="qr-action-btns"> <button class="qr-edit-btn" onclick="openEditQR(${q.id})">✏️ 編輯</button> <button class="qr-del-btn" onclick="deleteQR(${q.id})">🗑 刪除</button> </div> </div> </div>`).join(’’);
}
function uploadQR(id,input){
const f=input.files[0];if(!f)return;
const r=new FileReader();r.onload=e=>{const q=qrItems.find(q=>q.id===id);if(q){q.img=e.target.result;renderQR();}};r.readAsDataURL(f);
}
function openAddQR(){editingQRId=null;buildQRForm(‘新增票券’,{name:’’,desc:’’,date:’’});}
function openEditQR(id){
const item=qrItems.find(q=>q.id===id);
if(!item)return; editingQRId=id; buildQRForm(‘編輯票券’,item);
}
function buildQRForm(title,item){
document.getElementById(‘qrModalTitle’).textContent=title;
document.getElementById(‘qrForm’).innerHTML=` <div class="form-group"><label class="form-label">票券名稱</label><input class="form-input" id="qf-name" placeholder="例：日光東照宮門票" value="${item.name||''}"></div> <div class="form-group"><label class="form-label">說明</label><input class="form-input" id="qf-desc" placeholder="例：成人票 ¥1,300" value="${item.desc||''}"></div> <div class="form-group"><label class="form-label">使用日</label><input class="form-input" id="qf-date" placeholder="例：Day 3 · 5/14" value="${item.date||''}"></div> <button class="save-btn" onclick="saveQR()">💾 儲存</button> ${editingQRId?`<button class="delete-btn" onclick="delQRCurrent()">🗑 刪除</button>`:''}`;
document.getElementById(‘qrModal’).classList.add(‘open’);
}
function saveQR(){
const name=document.getElementById(‘qf-name’).value.trim();
const desc=document.getElementById(‘qf-desc’).value.trim();
const date=document.getElementById(‘qf-date’).value.trim();
if(!name){alert(‘請輸入票券名稱’);return;}
if(editingQRId){Object.assign(qrItems.find(q=>q.id===editingQRId),{name,desc,date});}
else{qrItems.push({id:Date.now(),name,desc,date,img:null});}
closeQRModal(); renderQR();
}
function deleteQR(id){if(!confirm(‘確定刪除？’))return;qrItems=qrItems.filter(q=>q.id!==id);renderQR();}
function delQRCurrent(){if(!editingQRId||!confirm(‘確定刪除？’))return;qrItems=qrItems.filter(q=>q.id!==editingQRId);closeQRModal();renderQR();}
function closeQRModal(){document.getElementById(‘qrModal’).classList.remove(‘open’);editingQRId=null;}

// ── Tab ──
function switchTab(tab){
[‘itinerary’,‘overview’,‘qr’].forEach(t=>{
document.getElementById(‘panel-’+t).classList.toggle(‘active’,t===tab);
document.getElementById(‘tab-’+t).classList.toggle(‘active’,t===tab);
});
document.getElementById(‘fabGroup’).style.display=tab===‘itinerary’?‘flex’:‘none’;
}

// ── Overview ──
function updateOverview(){
let total=0,spots=0;
Object.values(data.days).forEach(d=>{
(d.items||[]).forEach(i=>{total+=(i.cost||0);spots++;});
(d.transit||[]).forEach(tr=>(tr.lines||[]).forEach(l=>total+=(parseInt(l.fare)||0)));
});
const e1=document.getElementById(‘totalBudget’);if(e1)e1.textContent=‘¥’+total.toLocaleString();
const e2=document.getElementById(‘totalSpots’);if(e2)e2.textContent=spots;
}

// ── Util ──
function overlayClose(e,id,fn){if(e.target===document.getElementById(id))fn();}

// ── Init ──
renderDayChips();renderDayContent();renderQR();updateOverview();
setTimeout(()=>{const c=document.querySelectorAll(’.day-chip’);if(c[0])c[0].scrollIntoView({inline:‘start’});},100);
</script>
